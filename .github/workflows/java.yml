name: Java runtimes

on:
  push:
    branches: [master]
    paths: ['java/**', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/java*.yml']
  pull_request:
    paths: ['java/**', 'scripts/**', 'tests/**', '.dockerignore', '.github/workflows/java*.yml']
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-runtimes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the complete Java catalog and create the build matrix
        id: catalog
        run: |
          matrix=$(python3 scripts/java-matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Check shell syntax and runtime contracts
        run: |
          bash -n java/entrypoint.sh java/install-archive.sh
          python3 -m unittest discover -s tests -v

  java:
    needs: checks
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    uses: ./.github/workflows/java-runtime.yml
    with:
      runtime: ${{ toJSON(matrix) }}
